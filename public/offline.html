<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Çevrimdışı — Son Bir Söz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #fff; color: #0f172a; padding: 24px;
    }
    .card { text-align: center; max-width: 420px; }
    .card img { width: 96px; height: 96px; margin-bottom: 24px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #dc2626; color: #fff; border: 0; border-radius: 8px;
      padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f1f5f9; }
      p { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Son Bir Söz" />
    <h1>İnternet bağlantısı yok</h1>
    <p>Şu anda çevrimdışısınız. Bağlantınız geri geldiğinde en güncel haberlere ulaşabilirsiniz.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
